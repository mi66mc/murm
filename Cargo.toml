[workspace]
members = ["crates/murm-protocol", "crates/murm-relay", "crates/murm-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
murm-protocol = { path = "crates/murm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "0.4"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
ed25519-dalek = { version = "2.2", features = ["zeroize"] }
curve25519-dalek = "4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process"] }
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
toml = "0.9"
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
base64 = "0.22"
hmac = "0.12"
zeroize = "1"
argon2 = { version = "0.6", features = ["zeroize"] }
chacha20poly1305 = "0.11"
fs2 = "0.4"
directories = "6"
rpassword = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = "0.29"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
