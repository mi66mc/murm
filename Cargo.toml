[workspace]
members = ["crates/murm-protocol", "crates/murm-relay", "crates/murm-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
murm-protocol = { path = "crates/murm-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_jcs = "0.4"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
